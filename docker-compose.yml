services:
  postgres:
    image: postgres:15-alpine
    container_name: ft_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # パスワードの実値は git 管理外の .env にだけ置く。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください（.env.example を参照）}
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
    ports:
      # ホスト（psql / Prisma Studio / prisma migrate）から触れるようにしつつ、
      # 同じ LAN の他端末には見せないためループバックに限定する
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ft_redis
    ports:
      # 認証なしの Redis なので LAN には出さない（ホストからのデバッグ用のみ）
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    # prisma generate はイメージビルド時にも走るが、下の ./backend:/app バインドマウントが
    # その結果を覆い隠すため、ここで作り直す。Prisma Client はコミットしない生成物なので、
    # クローン直後（ファイルが1つも無い状態）でもこれで揃う
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    environment:
      # POSTGRES_PASSWORD の必須チェックは postgres サービス側で行っている
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ft_transcendence}
      REDIS_URL: redis://redis:6379
      # デフォルト値は置かない。未設定なら compose の起動時点で失敗させる
      JWT_SECRET: ${JWT_SECRET:?.env に JWT_SECRET を設定してください（openssl rand -base64 48 で生成）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      ALLOWED_DEV_ORIGIN: ${LAN_IP:-}
      NEXT_PUBLIC_SHOW_DEV_LOGIN: ${SHOW_DEV_LOGIN:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ft_nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
